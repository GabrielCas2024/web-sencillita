<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Página Web Sencilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-screen">
        <section class="login-card" aria-labelledby="login-title">
            <p class="eyebrow">Área privada</p>
            <h1 id="login-title">Iniciar sesión</h1>
            <p class="login-intro">Introduce tus datos para acceder a la página.</p>
            <form id="login-form" novalidate>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Entrar</button>
                <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
            </form>
            <p class="back-link"><a href="index.html">Volver a la página principal</a></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
